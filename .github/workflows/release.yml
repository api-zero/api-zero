name: Release

on:
  push:
    branches: [main]

# Never let two release runs race for the same tag or npm version.
concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the version PR's branch, tags and releases
      pull-requests: write # open and update the "Version Packages" PR
      id-token: write # npm provenance

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # changesets needs history to find the last release

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create version PR or publish to npm
        uses: changesets/action@v1
        with:
          # Runs when changesets are pending: opens/updates the version PR.
          version: pnpm run version:packages
          # Runs when no changesets are pending, i.e. the version PR merged.
          publish: pnpm run release
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
